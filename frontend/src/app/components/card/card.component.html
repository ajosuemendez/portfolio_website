<article class="project-card" [style.--card-order]="index">
  <div class="card-heading">
    <span class="project-number mono-label">0{{ index + 1 }}</span>
    <h3 class="project-title">{{ project.title }}</h3>
    <span *ngIf="project.link" class="project-arrow" aria-hidden="true">↗</span>
  </div>

  <div class="project-image-wrapper">
    <a
      *ngIf="project.link; else imageOnly"
      class="image-link"
      [href]="project.link"
      target="_blank"
      rel="noopener noreferrer"
      [attr.aria-label]="project.title + ' — ' + visitSiteText + '. ' + externalLinkLabel"
    >
      <img class="project-image" [src]="project.imagePath" [alt]="project.title + ' — ' + imageLabel" loading="lazy" />
      <span class="image-link-mark" aria-hidden="true">↗</span>
    </a>
    <ng-template #imageOnly>
      <div class="image-link">
        <img class="project-image" [src]="project.imagePath" [alt]="project.title + ' — ' + imageLabel" loading="lazy" />
      </div>
    </ng-template>
  </div>

  <div class="project-information">
    <div class="tech-list">
      <span *ngFor="let tech of project.tech" class="tech-chip">{{ tech }}</span>
    </div>
    <p class="project-description">{{ project.description }}</p>
    <a
      *ngIf="project.link"
      [href]="project.link"
      target="_blank"
      rel="noopener noreferrer"
      class="visit-link"
      [attr.aria-label]="project.title + ' — ' + visitSiteText + '. ' + externalLinkLabel"
    >
      {{ visitSiteText }} <span aria-hidden="true">↗</span>
    </a>
  </div>
</article>
