<div class="projects-container">
  <h2 #titleRef class="section-title fade-float-in delay-1">Projects</h2>

  <div class="projects-scroll" #scrollContainer (scroll)="onScroll()">
    <card
      *ngFor="let project of projects"
      class="fade-float-in"
      [project]="project">
    </card>
  </div>

  <!-- Dots indicator -->
  <div class="scroll-dots">
    <span
      *ngFor="let project of projects; let i = index"
      class="dot"
      [class.active]="i === activeIndex">
    </span>
  </div>
</div>
