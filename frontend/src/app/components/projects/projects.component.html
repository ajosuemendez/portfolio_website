<section class="projects-section page-shell" [class.archive-mode]="variant === 'work'" aria-labelledby="projects-title">
  <header class="projects-heading">
    <div class="projects-heading-copy">
      <p class="eyebrow">{{ eyebrow }}</p>
      <h1 *ngIf="variant === 'work'; else sectionTitle" id="projects-title" class="section-heading">{{ title }}</h1>
      <ng-template #sectionTitle>
        <h2 id="projects-title" class="section-heading">{{ title }}</h2>
      </ng-template>
      <p class="section-intro">{{ description }}</p>
    </div>
    <span class="project-total mono-label"><span aria-hidden="true">[</span> {{ projects.length }} <span aria-hidden="true">]</span></span>
  </header>

  <div class="projects-grid">
    <card *ngFor="let project of projects; let i = index" [project]="project" [index]="i"></card>
  </div>
</section>
