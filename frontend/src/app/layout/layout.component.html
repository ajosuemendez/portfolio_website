<div class="app-container">
  <a class="skip-link" href="#main-content">{{ uiText.skipToContent }}</a>
  <div class="site-blueprint-background" aria-hidden="true">
    <svg viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" focusable="false">
      <defs>
        <pattern id="shared-blueprint-grid" width="24" height="24" patternUnits="userSpaceOnUse">
          <path d="M24 0H0V24" fill="none" stroke="rgba(63, 95, 215, 0.1)" stroke-width="1" />
        </pattern>
        <linearGradient id="shared-building-blue" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#8598d0" />
          <stop offset="1" stop-color="#5b6f9f" />
        </linearGradient>
        <symbol id="shared-pixel-buildings" viewBox="0 0 180 200" preserveAspectRatio="xMidYMid meet">
          <g shape-rendering="crispEdges">
            <path d="M8 190V112H27V94H53V112H68V190Z" fill="#8796bf" />
            <path d="M57 190V64H74V42H94V22H118V42H136V190Z" fill="url(#shared-building-blue)" />
            <path d="M126 190V104H145V83H172V190Z" fill="#7587b3" />
            <rect x="101" y="8" width="4" height="14" fill="#7485b5" />
            <rect x="18" y="126" width="7" height="10" fill="#e39163" />
            <rect x="39" y="126" width="7" height="10" fill="#dce3f4" opacity="0.8" />
            <rect x="18" y="148" width="7" height="10" fill="#dce3f4" opacity="0.8" />
            <rect x="39" y="148" width="7" height="10" fill="#e39163" />
            <rect x="75" y="55" width="8" height="11" fill="#dce3f4" opacity="0.8" />
            <rect x="101" y="55" width="8" height="11" fill="#e39163" />
            <rect x="75" y="80" width="8" height="11" fill="#e39163" />
            <rect x="101" y="80" width="8" height="11" fill="#dce3f4" opacity="0.8" />
            <rect x="75" y="105" width="8" height="11" fill="#dce3f4" opacity="0.8" />
            <rect x="101" y="105" width="8" height="11" fill="#dce3f4" opacity="0.8" />
            <rect x="75" y="130" width="8" height="11" fill="#e39163" />
            <rect x="101" y="130" width="8" height="11" fill="#dce3f4" opacity="0.8" />
            <rect x="143" y="118" width="8" height="11" fill="#e39163" />
            <rect x="158" y="118" width="8" height="11" fill="#dce3f4" opacity="0.8" />
            <rect x="143" y="143" width="8" height="11" fill="#dce3f4" opacity="0.8" />
            <rect x="158" y="143" width="8" height="11" fill="#e39163" />
            <rect x="0" y="190" width="180" height="5" fill="#62749f" opacity="0.75" />
          </g>
        </symbol>
        <symbol id="shared-pixel-tower" viewBox="0 0 100 180" preserveAspectRatio="xMidYMid meet">
          <g shape-rendering="crispEdges">
            <path d="M10 176V54H25V38H37V20H63V38H76V54H90V176Z" fill="url(#shared-building-blue)" />
            <rect x="48" y="5" width="4" height="15" fill="#7d8dbb" />
            <rect x="26" y="66" width="9" height="12" fill="#dce3f4" opacity="0.8" />
            <rect x="49" y="66" width="9" height="12" fill="#e39163" />
            <rect x="72" y="66" width="9" height="12" fill="#dce3f4" opacity="0.8" />
            <rect x="26" y="92" width="9" height="12" fill="#e39163" />
            <rect x="49" y="92" width="9" height="12" fill="#dce3f4" opacity="0.8" />
            <rect x="72" y="92" width="9" height="12" fill="#dce3f4" opacity="0.8" />
            <rect x="26" y="118" width="9" height="12" fill="#dce3f4" opacity="0.8" />
            <rect x="49" y="118" width="9" height="12" fill="#e39163" />
            <rect x="72" y="118" width="9" height="12" fill="#dce3f4" opacity="0.8" />
          </g>
        </symbol>
        <symbol id="shared-pixel-hall" viewBox="0 0 160 100" preserveAspectRatio="xMidYMid meet">
          <g shape-rendering="crispEdges">
            <path d="M6 96V42H20V28H54V42H68V17H103V32H122V42H153V96Z" fill="#7e8fbe" />
            <rect x="18" y="54" width="10" height="13" fill="#dce3f4" opacity="0.8" />
            <rect x="40" y="54" width="10" height="13" fill="#e39163" />
            <rect x="74" y="44" width="10" height="13" fill="#dce3f4" opacity="0.8" />
            <rect x="96" y="44" width="10" height="13" fill="#e39163" />
            <rect x="127" y="54" width="10" height="13" fill="#dce3f4" opacity="0.8" />
            <rect x="18" y="76" width="10" height="13" fill="#e39163" />
            <rect x="74" y="76" width="10" height="13" fill="#e39163" />
            <rect x="127" y="76" width="10" height="13" fill="#dce3f4" opacity="0.8" />
          </g>
        </symbol>
      </defs>
      <rect width="1440" height="900" fill="url(#shared-blueprint-grid)" />
      <use href="#shared-pixel-buildings" x="285" y="90" width="78" height="87" class="blueprint-building building-soft" />
      <use href="#shared-pixel-buildings" x="1030" y="82" width="68" height="76" class="blueprint-building building-faint" />
      <use href="#shared-pixel-buildings" x="910" y="650" width="88" height="98" class="blueprint-building building-soft" />
      <use href="#shared-pixel-buildings" x="115" y="665" width="66" height="73" class="blueprint-building building-faint" />
      <use href="#shared-pixel-buildings" x="1250" y="405" width="74" height="82" class="blueprint-building building-soft" />
      <use href="#shared-pixel-buildings" x="740" y="350" width="60" height="67" class="blueprint-building building-faint" />
      <use href="#shared-pixel-buildings" x="540" y="785" width="62" height="69" class="blueprint-building building-faint" />
      <use href="#shared-pixel-tower" x="575" y="94" width="48" height="86" class="blueprint-building building-faint" />
      <use href="#shared-pixel-tower" x="1190" y="722" width="46" height="83" class="blueprint-building building-soft" />
      <use href="#shared-pixel-hall" x="680" y="700" width="112" height="70" class="blueprint-building building-faint" />
    </svg>
  </div>
  <header class="site-header" (keydown.escape)="closeMenu()">
    <div class="header-inner page-shell">
      <a class="brand" routerLink="/" [attr.aria-label]="uiText.homePage" (click)="closeMenu()">
        <span class="brand-mark" aria-hidden="true">AM</span>
        <span class="brand-name">Alejandro Mendez<span class="brand-period">.</span></span>
      </a>

      <nav class="sidebar-socials" [attr.aria-label]="uiText.socialLinks">
        <a
          class="social-link"
          [href]="socialLinks.linkedin"
          target="_blank"
          rel="noopener noreferrer"
          [attr.aria-label]="uiText.linkedinProfile"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="4" />
            <path d="M7.5 10v6.5M7.5 7.3v.1M11 16.5v-3.2a2.35 2.35 0 0 1 4.7 0v3.2" />
          </svg>
        </a>
        <a
          class="social-link"
          [href]="socialLinks.github"
          target="_blank"
          rel="noopener noreferrer"
          [attr.aria-label]="uiText.githubProfile"
        >
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8 19.5c-4.1 1.2-4.1-2-5.7-2.4M13.6 21v-3.1a2.7 2.7 0 0 0-.75-2.1c2.5-.28 5.15-1.23 5.15-5.56a4.3 4.3 0 0 0-1.15-3 4 4 0 0 0-.11-2.97s-.94-.3-3.1 1.15a10.7 10.7 0 0 0-5.65 0C5.83 3.97 4.9 4.27 4.9 4.27a4 4 0 0 0-.11 2.97 4.3 4.3 0 0 0-1.15 3c0 4.32 2.64 5.28 5.15 5.56a2.7 2.7 0 0 0-.75 2.08V21" />
          </svg>
        </a>
        <a class="social-link" [href]="'mailto:' + socialLinks.email" [attr.aria-label]="uiText.sendEmail">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <path d="m4 7 8 6 8-6" />
          </svg>
        </a>
      </nav>

      <nav id="primary-navigation" class="site-navigation" [attr.aria-label]="uiText.navigation">
        <a
          *ngFor="let item of navItems"
          class="nav-link"
          [class.nav-work]="item.path === '/work'"
          [routerLink]="item.path"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="item.path === '/' ? { exact: true } : { exact: false }"
          ariaCurrentWhenActive="page"
          (click)="closeMenu()"
        ><span class="nav-link-label">{{ navLabels[item.label] }}</span></a>
      </nav>

      <nav class="desktop-orbit-navigation" [attr.aria-label]="uiText.navigation" (wheel)="onOrbitWheel($event)">
        <div class="orbit-wheel">
          <div
            *ngFor="let item of orbitNavItems; trackBy: trackByNavPath"
            class="orbit-node"
            [class.is-wrapping]="item.isWrapping"
            [style.left.px]="item.left"
            [style.top.px]="item.top"
          >
            <a
              class="orbit-nav-link"
              [class.is-current]="item.isCurrent"
              [class.is-near]="item.distance === 1"
              [routerLink]="item.path"
              routerLinkActive="is-active"
              [routerLinkActiveOptions]="item.path === '/' ? { exact: true } : { exact: false }"
              ariaCurrentWhenActive="page"
              (click)="closeMenu()"
            >
              <span class="orbit-nav-icon" [ngSwitch]="item.label" [style.--hover-rotation]="item.hoverRotation + 'deg'" aria-hidden="true">
                <svg *ngSwitchCase="'home'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                  <path d="m3 10 9-7 9 7" /><path d="M5 9v11h14V9" /><path d="M9 20v-6h6v6" />
                </svg>
                <svg *ngSwitchCase="'me'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="8" r="3.5" /><path d="M5 20a7 7 0 0 1 14 0" />
                </svg>
                <svg *ngSwitchCase="'work'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="6" width="18" height="14" rx="2" /><path d="M8 6V4h8v2M3 11h18M10 11v2h4v-2" />
                </svg>
                <svg *ngSwitchCase="'email'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="5" width="18" height="14" rx="2" /><path d="m4 7 8 6 8-6" />
                </svg>
                <svg *ngSwitchCase="'cv'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M6 3h8l4 4v14H6z" /><path d="M14 3v5h5M9 13h6M9 16h6" />
                </svg>
              </span>
              <span class="orbit-nav-label" [style.--hover-rotation]="item.hoverRotation + 'deg'">
                {{ navLabels[item.label] }}
              </span>
            </a>
          </div>
        </div>
      </nav>

      <div class="header-actions">
        <div class="language-switch" role="group" [attr.aria-label]="uiText.language">
          <button type="button" [attr.aria-label]="uiText.englishLanguage" [class.is-selected]="selectedLang === 'en'" [attr.aria-pressed]="selectedLang === 'en'" (click)="setLanguage('en')">
            <img src="assets/images/english-flag.png" alt="" />
            <span>EN</span>
          </button>
          <span class="language-divider" aria-hidden="true"></span>
          <button type="button" [attr.aria-label]="uiText.germanLanguage" [class.is-selected]="selectedLang === 'de'" [attr.aria-pressed]="selectedLang === 'de'" (click)="setLanguage('de')">
            <img src="assets/images/german-flag.png" alt="" />
            <span>DE</span>
          </button>
        </div>

      </div>
    </div>
  </header>

  <main #contentArea class="app-content" [class.cv-route]="currentRoute.startsWith('/cv')" id="main-content" tabindex="-1">
    <router-outlet></router-outlet>
  </main>

  <div class="mobile-nav-dock" (keydown.escape)="closeMenu()">
    <nav class="mobile-bottom-nav" [attr.aria-label]="uiText.mobileNavigation">
      <a
        class="mobile-nav-item"
        routerLink="/"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        (click)="closeMenu()"
      >
        <svg class="mobile-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m3 10 9-7 9 7" /><path d="M5 9v11h14V9" /><path d="M9 20v-6h6v6" />
        </svg>
        <span>{{ navLabels.home }}</span>
      </a>

      <a
        class="mobile-nav-item mobile-nav-work"
        routerLink="/work"
        routerLinkActive="is-active"
        ariaCurrentWhenActive="page"
        (click)="closeMenu()"
      >
        <svg class="mobile-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="5" width="18" height="15" rx="2" /><path d="M8 5V3h8v2M3 10h18M10 10v2h4v-2" />
        </svg>
        <span>{{ navLabels.work }}</span>
        <i class="work-tab-spark" aria-hidden="true"></i>
      </a>

      <button
        class="mobile-nav-item mobile-nav-more"
        type="button"
        aria-controls="mobile-more-menu"
        [attr.aria-expanded]="mobileMoreOpen"
        [attr.aria-label]="mobileMoreOpen ? uiText.closeMore : uiText.more"
        [class.is-active]="isMoreRoute || mobileMoreOpen"
        (click)="toggleMoreMenu()"
      >
        <svg class="mobile-nav-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <circle cx="5" cy="12" r="1.7" /><circle cx="12" cy="12" r="1.7" /><circle cx="19" cy="12" r="1.7" />
        </svg>
        <span>{{ uiText.more }}</span>
      </button>
    </nav>

    <nav id="mobile-more-menu" class="mobile-more-menu" [hidden]="!mobileMoreOpen" [attr.aria-label]="uiText.navigation">
      <a *ngFor="let item of moreItems" [routerLink]="item.path" routerLinkActive="is-active" (click)="closeMenu()">
        {{ navLabels[item.label] }} <span aria-hidden="true">↗</span>
      </a>
    </nav>
  </div>
</div>
