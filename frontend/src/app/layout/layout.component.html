<div class="app-container">
  <a class="skip-link" href="#main-content">{{ uiText.skipToContent }}</a>
  <header class="site-header" (keydown.escape)="closeMenu()">
    <div class="header-inner page-shell">
      <a class="brand" routerLink="/" [attr.aria-label]="uiText.homePage" (click)="closeMenu()">
        <span class="brand-mark" aria-hidden="true">AM</span>
        <span class="brand-name">Alejandro Mendez<span class="brand-period">.</span></span>
      </a>

      <nav id="primary-navigation" class="site-navigation" [attr.aria-label]="uiText.navigation">
        <a
          *ngFor="let item of navItems"
          class="nav-link"
          [class.nav-cv]="item.path === '/cv'"
          [class.nav-work]="item.path === '/work'"
          [routerLink]="item.path"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="item.path === '/' ? { exact: true } : { exact: false }"
          ariaCurrentWhenActive="page"
          (click)="closeMenu()"
        >{{ navLabels[item.label] }}</a>
      </nav>

      <nav class="desktop-orbit-navigation" [attr.aria-label]="uiText.navigation">
        <div class="orbit-wheel">
          <div
            *ngFor="let item of orbitNavItems; trackBy: trackByNavPath"
            class="orbit-node"
            [class.wrap-top-to-bottom]="item.wrapDirection === 'top-to-bottom'"
            [class.wrap-bottom-to-top]="item.wrapDirection === 'bottom-to-top'"
            [style.left.px]="item.left"
            [style.top.px]="item.top"
          >
            <a
              class="orbit-nav-link"
              [class.is-current]="item.isCurrent"
              [class.is-near]="item.distance === 1"
              [routerLink]="item.path"
              routerLinkActive="is-active"
              [routerLinkActiveOptions]="item.path === '/' ? { exact: true } : { exact: false }"
              ariaCurrentWhenActive="page"
              (click)="closeMenu()"
            >
              <span class="orbit-nav-label">{{ navLabels[item.label] }}</span>
            </a>
          </div>
        </div>
      </nav>

      <div class="header-actions">
        <div class="language-switch" role="group" [attr.aria-label]="uiText.language">
          <button type="button" [attr.aria-label]="uiText.englishLanguage" [class.is-selected]="selectedLang === 'en'" [attr.aria-pressed]="selectedLang === 'en'" (click)="setLanguage('en')">
            <img src="assets/images/english-flag.png" alt="" />
            <span>EN</span>
          </button>
          <span class="language-divider" aria-hidden="true"></span>
          <button type="button" [attr.aria-label]="uiText.germanLanguage" [class.is-selected]="selectedLang === 'de'" [attr.aria-pressed]="selectedLang === 'de'" (click)="setLanguage('de')">
            <img src="assets/images/german-flag.png" alt="" />
            <span>DE</span>
          </button>
        </div>

      </div>
    </div>
  </header>

  <main #contentArea class="app-content" id="main-content" tabindex="-1">
    <router-outlet></router-outlet>
  </main>

  <div class="mobile-nav-dock" (keydown.escape)="closeMenu()">
    <nav class="mobile-bottom-nav" [attr.aria-label]="uiText.mobileNavigation">
      <a
        class="mobile-nav-item"
        routerLink="/"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        (click)="closeMenu()"
      >
        <svg class="mobile-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m3 10 9-7 9 7" /><path d="M5 9v11h14V9" /><path d="M9 20v-6h6v6" />
        </svg>
        <span>{{ navLabels.home }}</span>
      </a>

      <a
        class="mobile-nav-item mobile-nav-work"
        routerLink="/work"
        routerLinkActive="is-active"
        ariaCurrentWhenActive="page"
        (click)="closeMenu()"
      >
        <svg class="mobile-nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="5" width="18" height="15" rx="2" /><path d="M8 5V3h8v2M3 10h18M10 10v2h4v-2" />
        </svg>
        <span>{{ navLabels.work }}</span>
        <i class="work-tab-spark" aria-hidden="true"></i>
      </a>

      <button
        class="mobile-nav-item mobile-nav-more"
        type="button"
        aria-controls="mobile-more-menu"
        [attr.aria-expanded]="mobileMoreOpen"
        [attr.aria-label]="mobileMoreOpen ? uiText.closeMore : uiText.more"
        [class.is-active]="isMoreRoute || mobileMoreOpen"
        (click)="toggleMoreMenu()"
      >
        <svg class="mobile-nav-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <circle cx="5" cy="12" r="1.7" /><circle cx="12" cy="12" r="1.7" /><circle cx="19" cy="12" r="1.7" />
        </svg>
        <span>{{ uiText.more }}</span>
      </button>
    </nav>

    <nav id="mobile-more-menu" class="mobile-more-menu" [hidden]="!mobileMoreOpen" [attr.aria-label]="uiText.navigation">
      <a *ngFor="let item of moreItems" [routerLink]="item.path" routerLinkActive="is-active" (click)="closeMenu()">
        {{ navLabels[item.label] }} <span aria-hidden="true">↗</span>
      </a>
    </nav>
  </div>
</div>
