<div class="contact-page page-shell">
  <header class="contact-heading">
    <h1 class="page-title">{{ contactCopy.title }}</h1>
  </header>

  <section class="contact-methods" [attr.aria-label]="contactCopy.title">
    <div class="contact-method email-method">
      <a class="contact-method-main" [href]="'mailto:' + email">
        <span class="method-label mono-label">{{ contactCopy.emailLabel }}</span>
        <span class="contact-value">{{ email }}</span>
      </a>
      <div class="copy-area">
        <button class="copy-button" type="button" (click)="copyEmail()" [attr.aria-label]="contactCopy.copyCta">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="8" y="8" width="12" height="13" rx="2" />
            <path d="M16 8V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h2" />
          </svg>
          <span>{{ contactCopy.copyCta }}</span>
        </button>
      </div>
    </div>

    <a class="contact-method linkedin-method" [href]="linkedinUrl" target="_blank" rel="noopener noreferrer">
      <span class="contact-method-main">
        <span class="method-label mono-label">{{ contactCopy.linkedinLabel }}</span>
        <span class="contact-value">{{ contactCopy.linkedinCta }}</span>
      </span>
      <span class="contact-arrow" aria-hidden="true">↗</span>
    </a>
  </section>

  <div class="copy-toast" [class.is-visible]="copyState !== null" role="status" aria-live="polite">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M5 12.5 9.5 17 19 7.5" />
    </svg>
    <span>{{ copyFeedback }}</span>
  </div>
</div>
