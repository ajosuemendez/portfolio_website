<div class="home-page">
  <section class="home-hero" aria-labelledby="hero-title">
    <div class="pond-scene" aria-hidden="true">
      <svg class="pond-art" viewBox="0 0 1440 820" preserveAspectRatio="xMidYMid slice" focusable="false">
        <defs>
          <pattern id="pond-grid" width="24" height="24" patternUnits="userSpaceOnUse">
            <path d="M24 0H0V24" fill="none" stroke="rgba(63, 95, 215, 0.13)" stroke-width="1" />
          </pattern>
          <linearGradient id="koi-blue" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#91a7ff" />
            <stop offset="0.52" stop-color="#5274f3" />
            <stop offset="1" stop-color="#273e9d" />
          </linearGradient>
          <symbol id="pixel-koi" viewBox="0 0 240 132" preserveAspectRatio="xMidYMid meet">
            <g shape-rendering="crispEdges">
              <path d="M42 60 18 36 0 24v30l18 12L0 78v30l18-12 24-24Z" fill="url(#koi-blue)" />
              <path d="M42 60 54 48V36h24V24h24V12h48v12h24v12h24v12h24l18 12-18 18h-24v12h-24v12h-24v12h-48V96H96V84H72V72H54V60Z" fill="url(#koi-blue)" />
              <path d="M78 36h24v12H90v12H78Zm48-24h24v24h-12v12h-12V36h-12V24h12Zm24 48h24v12h-24Zm-60 24h24v12H90Z" fill="#f28b42" />
              <path d="M54 48h12v12H54Zm36-24h12v12H90Zm60 48h12v12h-12Zm24-24h12v12h-12Z" fill="#d9e0ff" opacity="0.88" />
              <path d="M196 54h18v24h-18l-12-12Z" fill="#dce3ff" />
              <rect x="204" y="59" width="6" height="6" fill="#16223a" />
              <path d="M214 69h12v6h-12Z" fill="#f28b42" />
              <path d="M28 42 40 54 28 60 16 54Z" fill="#f28b42" />
            </g>
          </symbol>
        </defs>
        <rect width="1440" height="820" fill="url(#pond-grid)" />
        <path class="water-ripple ripple-one" d="M120 590c170-45 320-45 500 0s330 45 520 0" />
        <path class="water-ripple ripple-two" d="M250 645c150-30 285-30 435 0s285 30 435 0" />
        <use href="#pixel-koi" x="438" y="180" width="490" height="270" class="koi-fish koi-main" />
        <use href="#pixel-koi" x="1040" y="310" width="230" height="126" class="koi-fish koi-distant" />
        <circle class="pond-particle particle-one" cx="342" cy="280" r="2" />
        <circle class="pond-particle particle-two" cx="1140" cy="200" r="2" />
        <circle class="pond-particle particle-three" cx="998" cy="540" r="1.5" />
      </svg>
      <div class="pond-vignette"></div>
    </div>

    <div class="hero-coordinate mono-label" aria-hidden="true">
      <span>AJM / 01</span><span class="coordinate-line"></span><span>Portfolio</span>
    </div>

    <div class="hero-copy">
      <p class="eyebrow hero-eyebrow reveal-in">{{ homeCopy.eyebrow }}</p>
      <h1 id="hero-title" class="hero-title">
        <span class="hero-role reveal-in"><span>{{ homeCopy.titleLead }}</span> {{ homeCopy.titleTail }}</span>
        <span class="hero-name reveal-in">Alejandro <span>Mendez</span></span>
      </h1>
      <p class="hero-statement reveal-in">{{ homeCopy.statement }}</p>

      <div class="hero-bottom-row reveal-in">
        <div class="hero-actions">
          <a class="action-link" routerLink="/work">
            {{ homeCopy.workCta }} <span aria-hidden="true">↘</span>
          </a>
          <a class="text-link" routerLink="/cv">
            {{ homeCopy.cvCta }} <span aria-hidden="true">↗</span>
          </a>
        </div>
      </div>
      <span class="hero-scroll-note mono-label">{{ homeCopy.scrollHint }} <span aria-hidden="true">↓</span></span>
    </div>
  </section>

  <projects></projects>
</div>
