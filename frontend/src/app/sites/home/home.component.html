<div class="top-overlay" [class.de]="selectedLang === 'de'"
  [ngStyle]="{ height: topOverlayHeight + 'px' }">
  <div class="profile-container">
   <h2 class="profile-title profile-animate">Fullstack Software Developer</h2>
    <div class="profile-pic profile-animate"></div>
    <h2 class="profile-name profile-animate">Alejandro Mendez</h2>
    <div #languageSwitchContainer class="language-switch switch-animate">
      <div class="highlight" [class.right]="selectedLang === 'de'"></div>
  
      <button (click)="toggleLanguage()">
        <img src="assets/images/english-flag.png" alt="English" />
      </button>
      <button (click)="toggleLanguage()">
        <img src="assets/images/german-flag.png" alt="Deutsch" />
      </button>
    </div>
  </div>
  <projects></projects>
</div>
