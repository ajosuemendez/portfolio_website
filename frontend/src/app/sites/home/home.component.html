      <p class="hero-statement reveal-in">{{ homeCopy.statement }}</p>

      <div class="hero-bottom-row reveal-in">
        <div class="hero-actions">
          <a class="action-link" routerLink="/work">
            {{ homeCopy.workCta }}
            <span class="desktop-cta-arrow" aria-hidden="true">↘</span>
            <svg class="mobile-cta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="6" width="18" height="14" rx="2" />
              <path d="M8 6V4h8v2M3 11h18M10 11v2h4v-2" />
            </svg>
          </a>
          <a class="text-link" routerLink="/cv">
            {{ homeCopy.cvCta }}
            <span class="desktop-cta-arrow" aria-hidden="true">↗</span>
            <svg class="mobile-cta-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
